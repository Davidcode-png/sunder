[package]
name = "sunder"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "=4.6.4", features = ["derive", "env"] }
futures-util = "0.3"
